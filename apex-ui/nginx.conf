# Overrides only the server block; global settings (gzip, mime types, worker
# config) come from nginx-unprivileged's own base nginx.conf, which already
# includes conf.d/*.conf.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file resolves to
    # index.html so the client-side router (Phase 6) owns the route instead
    # of nginx returning a 404 on a hard refresh of e.g. /board.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
