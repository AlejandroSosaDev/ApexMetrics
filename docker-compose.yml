name: apexmetrics

services:
  apex-db:
    image: mysql:8.4
    container_name: apex-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Host-side only, for connecting a local SQL client during development.
      # 3308 avoids colliding with a MySQL instance already using 3306 on the
      # host; apex-api always reaches this service over the internal network
      # on its native port 3306.
      - "${DB_HOST_PORT:-3308}:3306"
    volumes:
      - apex-db-data:/var/lib/mysql
      # Scripts here run once, in alphabetical order, only when the data
      # directory is empty (REQ-4.4). schema.sql before seed.sql is
      # enforced by the numeric prefix, not by listing order below.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -u root -p"$$MYSQL_ROOT_PASSWORD": the double $$ escapes Compose's own
      # variable interpolation so the literal string reaches the container
      # shell, which then expands $MYSQL_ROOT_PASSWORD from its own env.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - apex-network

  apex-api:
    build:
      context: ./apex-api
    container_name: apex-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # ASP.NET Core's double-underscore convention maps this to the nested
      # config key ConnectionStrings:Default. Unused by Program.cs until
      # Phase 2 wires up EF Core (ADR-0001) — declared now so this file does
      # not need a second edit once that code lands.
      ConnectionStrings__Default: "Server=apex-db;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      # REQ-4.3: the backend waits for the database to be healthy, not just
      # started — mysqld accepts TCP connections before it has finished
      # applying db/schema.sql and db/seed.sql, so "started" would let the
      # API race the seed and see an empty schema.
      apex-db:
        condition: service_healthy
    networks:
      - apex-network

  apex-ui:
    build:
      context: ./apex-ui
      args:
        # Vite inlines this into the bundle at build time, so it must be the
        # address the user's BROWSER can reach, not the internal Docker
        # network name — "apex-api" resolves only inside this compose
        # network, not on the host serving the browser.
        VITE_API_BASE_URL: http://localhost:${API_HOST_PORT:-8080}
    container_name: apex-ui
    restart: unless-stopped
    ports:
      - "${UI_HOST_PORT:-5173}:8080"
    # No depends_on: apex-ui is a static SPA that calls the API from the
    # browser, not at container start, so it has nothing to wait for. It is
    # deliberately able to start (and show a "connecting..." state) before
    # apex-api is ready, matching the free-tier cold-start UX this project
    # is designed around.
    networks:
      - apex-network

networks:
  apex-network:
    driver: bridge

volumes:
  apex-db-data:
